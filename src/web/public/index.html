<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboard · PT MABAR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23111%22/><g fill=%22%23f1c40f%22><rect x=%225%22 y=%229%22 width=%223%22 height=%226%22 rx=%221.5%22/><rect x=%2210.5%22 y=%225%22 width=%223%22 height=%2214%22 rx=%221.5%22/><rect x=%2216%22 y=%228%22 width=%223%22 height=%228%22 rx=%221.5%22/></g></svg>">
  <script>
    // Saved choice wins; otherwise follow the OS. Runs before paint so there is no flash.
    try { document.documentElement.dataset.theme = localStorage.getItem('ptmabar_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Theme "Langit": elevation by tone steps; the one hue (cobalt) sits on the primary action and the playing sound. */
    :root {
      color-scheme: light;
      --ground: #f3f6f9; --surface: #ffffff; --raised: #eaeef2; --hover: #f8fafc;
      --border: #e3e8ee; --rule: #edf1f5; --control: #cfd6de;
      --text: #16202a; --muted: #55606b; --faint: #64707c;
      --accent: #1d5fd6; --negative: #c41c29;
      --primary: #2563eb; --on-primary: #ffffff; --primary-hover: #1d4fd0; /* same in both themes */
      --tint: #eaeef2; --raised-hover: #dde3ea; --scrim: rgba(243,246,249,.92);
      --mark-bg: #16202a; --mark: #f1c40f;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ground: #121314; --surface: #1b1c1e; --raised: #2a2b2e; --hover: #17181a;
      --border: #232427; --rule: #1f2023; --control: #45474b;
      --text: #f2f3f5; --muted: #b4b6ba; --faint: #95989d;
      --accent: #6ea8fe; --negative: #f0717f;
      --tint: #26272a; --raised-hover: #37383c; --scrim: rgba(18,19,20,.9);
      --mark-bg: #2a2b2e; --mark: #f1c40f;
    }
    :root {
      --radius-card: 20px; --radius-control: 999px;
      --gap: 14px; --pad: 22px; --control-height: 36px;
      --font: "Inter", system-ui, sans-serif;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { background: var(--ground); color: var(--text); font: 14px/20px var(--font); min-height: 100vh; }
    button, input { font: inherit; color: inherit; }
    .num { font-variant-numeric: tabular-nums; }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

    /* Buttons */
    .btn { height: var(--control-height); padding: 0 16px; border-radius: var(--radius-control); border: 1px solid var(--control);
      background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; white-space: nowrap;
      transition: background .15s, transform .1s; }
    .btn:hover { background: var(--tint); }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: .55; cursor: default; }
    .link { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 6px 8px; border-radius: 8px; font-weight: 500; }
    .link:hover { color: var(--text); background: var(--tint); }
    .link.danger:hover { color: var(--negative); }

    /* Top bar: mark, product, scope */
    .topbar { height: 56px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--ground); z-index: 10; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    .topbar .wrap { height: 100%; display: flex; align-items: center; gap: 12px; }
    .mark { width: 28px; height: 28px; flex: none; }
    .product { font-weight: 600; }
    /* Views: Soundboard and Playlist, switched by the URL hash */
    .tabs { display: flex; gap: 4px; margin-left: 8px; }
    .tabs a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 8px; font-weight: 500; }
    .tabs a:hover, .tabs a[aria-current="page"] { color: var(--text); background: var(--tint); }
    .topbar .spacer { flex: 1; }

    /* Title row */
    .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 36px 0 24px; }
    h1, .login-title { font-size: 20px; line-height: 28px; font-weight: 600; }
    .subline { color: var(--muted); margin-top: 4px; }
    .subline code { font-family: var(--mono); color: var(--text); white-space: nowrap; }

    /* Upload panel (shown once a file is picked or dropped) */
    .upload { background: var(--surface); border-radius: var(--radius-card); padding: var(--pad); margin-bottom: var(--gap); }
    .upload-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 12px; }
    .upload label { display: block; font-weight: 500; margin-bottom: 8px; }
    .field { display: flex; align-items: center; height: 40px; background: var(--ground); border: 1px solid var(--control); border-radius: 10px; padding: 0 12px; }
    .field:focus-within { border-color: var(--text); }
    .field .prefix { font-family: var(--mono); color: var(--faint); margin-right: 6px; }
    .field input { flex: 1; background: none; border: 0; outline: none; font-family: var(--mono); min-width: 0; }
    .file-meta { color: var(--muted); }
    .upload-actions { display: flex; gap: 8px; }

    /* Toolbar */
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
    .search { width: 300px; height: var(--control-height); display: flex; align-items: center; gap: 8px; padding: 0 14px;
      background: var(--surface); border-radius: var(--radius-control); }
    .search svg { flex: none; color: var(--faint); }
    .search input { flex: 1; background: none; border: 0; outline: none; min-width: 0; }
    .search input::placeholder, .field input::placeholder { color: var(--faint); }
    .count { color: var(--muted); }

    /* Sound table */
    .table { width: 100%; }
    .row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 72px 150px 104px 172px; align-items: center; gap: 16px;
      min-height: 64px; padding: 0 12px; border-bottom: 1px solid var(--rule); position: relative; }
    .row.head { min-height: 40px; color: var(--faint); font-size: 12px; border-bottom: 0; }
    .row:not(.head):hover { background: var(--hover); }
    .r { text-align: right; }
    .play { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--raised); cursor: pointer; display: grid; place-items: center;
      transition: transform .1s, background .15s; }
    .play:hover { background: var(--raised-hover); }
    .play:active { transform: scale(.92); }
    .row.playing .play { background: var(--primary); color: var(--on-primary); }
    .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmd { display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; font-family: var(--mono); font-size: 13px; color: var(--faint);
      background: none; border: 0; cursor: pointer; padding: 0; }
    .cmd:hover { color: var(--text); }
    .size { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 6px; text-align: right; }
    .bar { height: 2px; margin-right: 4px; background: var(--raised); border-radius: 1px; }
    .bar i { display: block; height: 100%; background: var(--faint); border-radius: 1px; }
    .unit { color: var(--faint); }
    .date { color: var(--muted); }
    .actions { display: flex; justify-content: flex-end; gap: 4px; }
    .progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--primary); width: 0; }
    .row.playing .dur { color: var(--accent); }
    .sub-meta { display: none; color: var(--faint); font-size: 13px; }

    .empty { margin-top: 8px; border: 1px dashed var(--control); border-radius: 12px; padding: 20px; color: var(--muted); text-align: center; }
    .empty button { color: var(--text); text-decoration: underline; background: none; border: 0; cursor: pointer; }

    /* Drop overlay: the whole window takes a dropped file */
    .drop { position: fixed; inset: 12px; border: 2px dashed var(--text); border-radius: var(--radius-card); background: var(--scrim);
      display: none; place-items: center; z-index: 50; font-size: 16px; font-weight: 500; pointer-events: none; }
    body.dragging .drop { display: grid; }

    /* Confirm / rename dialog; the dimmed backdrop separates it, no shadow needed */
    .ask { margin: auto; width: min(400px, calc(100% - 32px)); border: 0; border-radius: var(--radius-card); padding: 24px;
      background: var(--surface); color: var(--text); }
    .ask::backdrop { background: rgba(0,0,0,.45); }
    .ask-title { font-size: 16px; line-height: 24px; font-weight: 600; }
    .ask-msg { color: var(--muted); margin-top: 4px; }
    .ask .field { margin-top: 16px; }

    /* Playlist view: list of playlists on the left, the selected one on the right */
    .pl-grid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: var(--gap); align-items: start; padding-bottom: 48px; }
    .pl-grid.solo { grid-template-columns: 1fr; }
    .pl-list { background: var(--surface); border-radius: var(--radius-card); padding: 8px; display: grid; gap: 2px; }
    .pl-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 10px 12px;
      border: 0; border-radius: 12px; background: none; cursor: pointer; text-align: left; }
    .pl-item:hover { background: var(--hover); }
    .pl-item[aria-current="true"] { background: var(--tint); }
    .pl-item .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pl-item .c { color: var(--muted); font-size: 12px; flex: none; }
    .pl-detail { background: var(--surface); border-radius: var(--radius-card); padding: var(--pad); min-width: 0; }
    .pl-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .pl-head h2 { font-size: 18px; line-height: 26px; font-weight: 600; }
    .pl-add { display: flex; gap: 8px; margin: 20px 0 16px; }
    .pl-add .field { flex: 1; }
    .field input.plain { font-family: var(--font); }
    .songs { padding-left: 28px; }
    .pl-detail .empty { margin-top: 0; }
    .songs li { padding: 10px 0; border-bottom: 1px solid var(--rule); }
    .songs li::marker { color: var(--faint); font-variant-numeric: tabular-nums; }
    .song { display: flex; align-items: center; gap: 12px; }
    .song a { flex: 1; min-width: 0; color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .song a:hover { text-decoration: underline; }
    .song .dur { color: var(--muted); flex: none; }
    .ask-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
    .btn-danger { background: var(--negative); color: var(--ground); border-color: var(--negative); }
    .btn-danger:hover { opacity: .9; background: var(--negative); }

    /* Theme switch: sun and moon (Lucide), the knob slides over the active one */
    .theme-switch { position: relative; flex: none; width: 60px; height: 32px; border: 0; border-radius: 999px; background: var(--raised);
      cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 0 9px; color: var(--faint); }
    .theme-switch .knob { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface);
      transition: transform .2s; }
    [data-theme="dark"] .theme-switch .knob { transform: translateX(28px); }
    .theme-switch .ic { position: relative; z-index: 1; width: 14px; height: 14px; }
    :root:not([data-theme="dark"]) .theme-switch .sun, [data-theme="dark"] .theme-switch .moon { color: var(--text); }

    /* Login */
    #login-overlay { position: fixed; inset: 0; background: var(--ground); display: grid; place-items: center; z-index: 100; padding: 16px; }
    .login-wrap { width: 100%; max-width: 360px; display: grid; gap: 16px; justify-items: center; }
    .login { width: 100%; background: var(--surface); border-radius: var(--radius-card); padding: 32px 28px 28px; text-align: center; }
    .login .mark { width: 48px; height: 48px; margin-bottom: 20px; }
    .login p { color: var(--muted); margin-top: 4px; }
    /* The PIN is typed into a transparent text input laid over a row of dots, so the dots are always centred
       and there is no password field for the browser's reveal button or a password manager to latch onto. */
    .pin-box { position: relative; height: 64px; margin: 24px 0 16px; border-radius: 16px; background: var(--ground);
      border: 1px solid var(--control); display: flex; align-items: center; justify-content: center; gap: 14px; transition: border-color .15s; }
    .pin-box:focus-within { border-color: var(--accent); }
    .pin-box.error { border-color: var(--negative); animation: shake .3s; }
    .pin-box input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; font-size: 16px; cursor: text;
      color: transparent; caret-color: transparent; }
    .slot { width: 12px; height: 12px; border-radius: 50%; background: var(--control); transition: background .12s, transform .12s; }
    .slot.on { background: var(--text); transform: scale(1.1); }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .login .btn { width: 100%; justify-content: center; height: 44px; }
    .login .login-error { color: var(--negative); margin-top: 12px; }

    /* Toast floats, so it may carry a shadow */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 16px); background: var(--raised); padding: 10px 18px;
      border-radius: var(--radius-control); box-shadow: 0 8px 24px rgba(0,0,0,.5); opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s; z-index: 200; white-space: nowrap; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.error { color: var(--negative); }

    @media (max-width: 900px) {
      .row { grid-template-columns: 40px minmax(0, 1fr) 64px 140px 172px; }
      .col-date { display: none; }
    }
    @media (max-width: 640px) {
      .wrap { padding: 0 16px; }
      .product { display: none; }
      .tabs { margin-left: 0; gap: 0; }
      .tabs a { padding: 6px 8px; }
      .pl-grid { grid-template-columns: 1fr; }
      .pl-add { flex-direction: column; }
      .pl-add .btn { justify-content: center; height: 44px; }
      .title-row { padding: 24px 0 16px; flex-direction: column; align-items: stretch; }
      .title-row .btn { justify-content: center; height: 44px; }
      .toolbar { flex-direction: column; align-items: stretch; gap: 8px; }
      .search { width: 100%; height: 44px; }
      .row.head { display: none; }
      .row { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; }
      .row .col-dur, .row .col-size { display: none; }
      .sub-meta { display: block; }
      .actions { grid-column: 2 / -1; justify-content: flex-start; margin-left: -8px; }
      .upload-foot { flex-direction: column; align-items: stretch; }
      .upload-actions .btn { flex: 1; justify-content: center; height: 44px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="var(--mark-bg)"/><g fill="var(--mark)"><rect x="5" y="9" width="3" height="6" rx="1.5"/><rect x="10.5" y="5" width="3" height="14" rx="1.5"/><rect x="16" y="8" width="3" height="8" rx="1.5"/></g></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 16 16"><path d="M4.5 3h2.5v10H4.5zM9 3h2.5v10H9z" fill="currentColor"/></symbol>
    <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <!-- Lucide "sun" and "moon" (ISC licence) -->
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  </svg>

  <!-- Login -->
  <div id="login-overlay">
    <div class="login-wrap">
      <form class="login" autocomplete="off" onsubmit="event.preventDefault(); submitPin()">
        <svg class="mark" aria-hidden="true"><use href="#mark"/></svg>
        <h2 class="login-title">Soundboard PT MABAR</h2>
        <p>Masukkan PIN untuk mengelola sound bot.</p>
        <div class="pin-box" id="pin-box">
          <input type="text" id="pin-field" inputmode="numeric" maxlength="6" aria-label="PIN" autofocus
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other" oninput="renderPin()" />
          <span id="pin-slots" aria-hidden="true" style="display:contents"></span>
        </div>
        <button class="btn btn-primary" type="submit">Masuk</button>
        <p id="login-error" class="login-error" hidden>PIN salah, coba lagi.</p>
      </form>
      <button class="theme-switch" type="button" role="switch" aria-label="Mode gelap" onclick="toggleTheme()">
        <svg class="ic sun" aria-hidden="true"><use href="#i-sun"/></svg><svg class="ic moon" aria-hidden="true"><use href="#i-moon"/></svg><span class="knob"></span>
      </button>
    </div>
  </div>

  <header class="topbar">
    <div class="wrap">
      <svg class="mark" aria-hidden="true"><use href="#mark"/></svg>
      <span class="product">PT MABAR</span>
      <nav class="tabs" aria-label="Halaman">
        <a href="#soundboard">Soundboard</a>
        <a href="#playlist">Playlist</a>
      </nav>
      <span class="spacer"></span>
      <button class="theme-switch" type="button" role="switch" aria-label="Mode gelap" onclick="toggleTheme()">
        <svg class="ic sun" aria-hidden="true"><use href="#i-sun"/></svg><svg class="ic moon" aria-hidden="true"><use href="#i-moon"/></svg><span class="knob"></span>
      </button>
      <button class="link" onclick="logout()">Keluar</button>
    </div>
  </header>

  <main class="wrap">
    <div class="title-row">
      <div>
        <h1 id="view-title">Soundboard</h1>
        <p class="subline" id="subline">Memuat sound…</p>
        <p class="subline" id="pl-subline" hidden>Memuat playlist…</p>
      </div>
      <button class="btn btn-primary" id="sb-action" onclick="document.getElementById('file-input').click()">Upload sound</button>
      <button class="btn btn-primary" id="pl-action" hidden onclick="createPlaylist()">Buat playlist</button>
    </div>

    <section id="view-soundboard">
    <input type="file" id="file-input" accept="audio/mpeg,.mp3" hidden onchange="onFileSelected(this.files[0])" />

    <form class="upload" id="upload-panel" hidden onsubmit="event.preventDefault(); startUpload()">
      <label for="sound-name-input">Nama command</label>
      <div class="field"><span class="prefix">!sb</span><input type="text" id="sound-name-input" placeholder="nama" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="keepName(this)" /></div>
      <div class="upload-foot">
        <p class="file-meta" id="file-info"></p>
        <div class="upload-actions">
          <button class="btn" type="button" onclick="resetUpload()">Batal</button>
          <button class="btn btn-primary" id="upload-btn" type="submit">Simpan sound</button>
        </div>
      </div>
    </form>

    <div class="toolbar">
      <label class="search">
        <svg width="14" height="14" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="search-box" placeholder="Cari sound" aria-label="Cari sound" oninput="filterSounds()" />
      </label>
      <span class="count num" id="sound-count"></span>
    </div>

    <div class="table" id="sound-table"></div>
    </section>

    <section id="view-playlist" hidden>
      <div class="pl-grid">
        <div class="pl-list" id="pl-list"></div>
        <div class="pl-detail" id="pl-detail"></div>
      </div>
    </section>
  </main>

  <div class="drop">Lepas file .mp3 untuk menambah sound</div>
  <dialog id="ask" class="ask" aria-labelledby="ask-title">
    <form method="dialog">
      <h2 class="ask-title" id="ask-title"></h2>
      <p class="ask-msg" id="ask-msg"></p>
      <div class="field" id="ask-field" hidden><span class="prefix" id="ask-prefix">!sb</span><input id="ask-input" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="keepName(this)" aria-label="Nama baru" /></div>
      <div class="ask-actions">
        <button class="btn" type="button" onclick="this.closest('dialog').close()">Batal</button>
        <button class="btn btn-primary" id="ask-ok" value="ok">OK</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>

  <script>
    let currentSounds = [];
    let selectedFile = null;
    const player = new Audio();
    let playingName = null;

    function getSavedPin() {
      return localStorage.getItem('ptmabar_pin') || '';
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.toggle('error', isError);
      toast.classList.add('show');
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function submitPin() {
      const pin = document.getElementById('pin-field').value.trim();
      if (!pin) return;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        });
        if (res.ok) {
          localStorage.setItem('ptmabar_pin', pin);
          document.getElementById('login-overlay').style.display = 'none';
          document.getElementById('login-error').hidden = true;
          loadSounds();
          showView();
        } else {
          document.getElementById('login-error').hidden = false;
          const box = document.getElementById('pin-box');
          box.classList.remove('error');
          void box.offsetWidth; // restart the shake
          box.classList.add('error');
          document.getElementById('pin-field').value = '';
          renderPin();
        }
      } catch (err) {
        showToast('Gagal menghubungi server: ' + err.message, true);
      }
    }

    // Six slots; one filled dot per typed digit.
    function renderPin() {
      const len = document.getElementById('pin-field').value.length;
      if (len) document.getElementById('pin-box').classList.remove('error');
      document.getElementById('pin-slots').innerHTML =
        Array.from({ length: 6 }, (_, i) => `<span class="slot${i < len ? ' on' : ''}"></span>`).join('');
    }

    function setThemeLabel() {
      const dark = String(document.documentElement.dataset.theme === 'dark');
      document.querySelectorAll('.theme-switch').forEach(b => b.setAttribute('aria-checked', dark));
    }
    function toggleTheme() {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('ptmabar_theme', next); } catch {}
      setThemeLabel();
    }

    function logout() {
      localStorage.removeItem('ptmabar_pin');
      location.reload();
    }

    document.addEventListener('DOMContentLoaded', () => {
      setThemeLabel();
      const savedPin = getSavedPin();
      if (savedPin) {
        document.getElementById('pin-field').value = savedPin;
        submitPin();
      }
      renderPin();

      // The whole window accepts a dropped .mp3
      let depth = 0;
      addEventListener('dragenter', e => { e.preventDefault(); if (location.hash === '#playlist') return; depth++; document.body.classList.add('dragging'); });
      addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
      addEventListener('dragover', e => e.preventDefault());
      addEventListener('drop', e => {
        e.preventDefault();
        depth = 0;
        document.body.classList.remove('dragging');
        if (location.hash !== '#playlist' && e.dataTransfer.files.length > 0) onFileSelected(e.dataTransfer.files[0]);
      });
    });
    addEventListener('hashchange', showView);

    const fmtKB = bytes => (bytes / 1024).toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const fmtMB = bytes => (bytes / 1048576).toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const fmtDur = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
    const fmtDate = ms => new Date(ms).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    const rawUrl = s => `/api/raw/${encodeURIComponent(s.filename)}?pin=${encodeURIComponent(getSavedPin())}`;

    // Sound names are one word: lowercase letters, digits, - and _. Spaces anywhere are dropped as they are typed.
    const cleanName = v => v.toLowerCase().replace(/[^a-z0-9_-]/g, '');
    function keepName(el) {
      const v = cleanName(el.value);
      if (v === el.value) return;
      const caret = Math.max(0, el.selectionStart - (el.value.length - v.length));
      el.value = v;
      el.setSelectionRange(caret, caret);
    }

    function onFileSelected(file) {
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.mp3')) return showToast('File harus berformat .mp3', true);
      if (file.size > 500 * 1024) return showToast(`File ${fmtKB(file.size)} KB, maksimal 500 KB`, true);

      selectedFile = file;
      const nameInput = document.getElementById('sound-name-input');
      nameInput.value = cleanName(file.name.replace(/\.[^/.]+$/, ''));
      document.getElementById('file-info').textContent = `${file.name} · ${fmtKB(file.size)} KB`;
      document.getElementById('upload-panel').hidden = false;
      nameInput.focus();
      nameInput.select();
    }

    function resetUpload() {
      selectedFile = null;
      document.getElementById('file-input').value = '';
      document.getElementById('upload-panel').hidden = true;
    }

    async function startUpload() {
      if (!selectedFile) return;
      const soundName = cleanName(document.getElementById('sound-name-input').value);
      if (!soundName) return showToast('Nama hanya boleh huruf, angka, - dan _', true);
      if (currentSounds.some(s => s.name === soundName) && !await ask({
        title: `Timpa "${soundName}"?`,
        message: `Sound dengan nama ini sudah ada. File lama diganti dengan ${selectedFile.name}.`,
        confirm: 'Timpa', danger: true,
      })) return;

      const uploadBtn = document.getElementById('upload-btn');
      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Mengupload…';
      try {
        const res = await fetch(`/api/upload?name=${encodeURIComponent(soundName)}`, {
          method: 'POST',
          headers: { 'X-Pin': getSavedPin(), 'Content-Type': 'audio/mpeg' },
          body: selectedFile,
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showToast(`!sb ${soundName} siap dipakai`);
          resetUpload();
          loadSounds();
        } else {
          showToast(data.error || 'Gagal upload', true);
        }
      } catch (err) {
        showToast('Koneksi upload gagal: ' + err.message, true);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Simpan sound';
      }
    }

    async function loadSounds() {
      try {
        const res = await fetch('/api/sounds', { headers: { 'X-Pin': getSavedPin() } });
        if (res.status === 401) {
          document.getElementById('login-overlay').style.display = 'grid';
          return;
        }
        const data = await res.json();
        currentSounds = data.sounds || [];
        const total = currentSounds.reduce((a, s) => a + s.size, 0);
        document.getElementById('subline').innerHTML =
          `${currentSounds.length} sound · ${fmtMB(total)} MB · panggil di Discord dengan <code>!sb nama [1-10]</code>`;
        filterSounds();
        loadDurations();
      } catch (err) {
        document.getElementById('sound-table').innerHTML =
          `<p class="empty">Daftar sound gagal dimuat. <button onclick="loadSounds()">Coba lagi</button></p>`;
      }
    }

    // Duration comes from each file's metadata; cached on the sound object.
    function loadDurations() {
      currentSounds.filter(s => s.duration == null).forEach(s => {
        const a = new Audio();
        a.preload = 'metadata';
        a.onloadedmetadata = () => {
          s.duration = a.duration;
          const cell = document.querySelector(`[data-dur="${s.name}"]`);
          if (cell) cell.textContent = fmtDur(a.duration);
          const sub = document.querySelector(`[data-sub="${s.name}"]`);
          if (sub) sub.textContent = `${fmtDur(a.duration)} · ${fmtKB(s.size)} KB`;
        };
        a.src = rawUrl(s);
      });
    }

    function renderSounds(sounds) {
      const table = document.getElementById('sound-table');
      const q = document.getElementById('search-box').value.trim();
      document.getElementById('sound-count').textContent =
        q ? `${sounds.length} dari ${currentSounds.length} sound` : '';

      const head = `<div class="row head"><span></span><span>Sound</span><span class="r col-dur">Durasi</span><span class="r col-size">Ukuran</span><span class="r col-date">Diubah</span><span></span></div>`;

      if (sounds.length === 0) {
        table.innerHTML = head + (currentSounds.length === 0
          ? `<p class="empty">Belum ada sound. Seret file .mp3 ke jendela ini, atau <button onclick="document.getElementById('file-input').click()">pilih file</button>.</p>`
          : `<p class="empty">Tidak ada sound yang cocok dengan "${q.replace(/[<&"]/g, '')}".</p>`);
        return;
      }

      const maxSize = Math.max(...currentSounds.map(s => s.size));
      // Names are sanitized server-side to [a-z0-9_-], so they are safe in markup.
      table.innerHTML = head + sounds.map(s => {
        const dur = s.duration != null ? fmtDur(s.duration) : '—';
        const playing = playingName === s.name;
        return `
          <div class="row${playing ? ' playing' : ''}" data-row="${s.name}">
            <button class="play" onclick="togglePlay('${s.name}')" aria-label="${playing ? 'Jeda' : 'Putar'} ${s.name}">
              <svg width="16" height="16" aria-hidden="true"><use href="#${playing ? 'i-pause' : 'i-play'}"/></svg>
            </button>
            <div style="min-width:0">
              <div class="name">${s.name}</div>
              <button class="cmd" onclick="copyCommand('${s.name}')" title="Salin command">!sb ${s.name}
                <svg width="12" height="12" aria-hidden="true"><use href="#i-copy"/></svg></button>
              <div class="sub-meta num" data-sub="${s.name}">${dur} · ${fmtKB(s.size)} KB</div>
            </div>
            <span class="r num dur col-dur" data-dur="${s.name}">${dur}</span>
            <span class="size num col-size"><span class="bar"><i style="width:${(s.size / maxSize * 100).toFixed(1)}%"></i></span>${fmtKB(s.size)}<span class="unit">KB</span></span>
            <span class="r num date col-date">${fmtDate(s.updatedAt)}</span>
            <div class="actions">
              <button class="link" onclick="renameSound('${s.name}')">Ganti nama</button>
              <button class="link danger" onclick="deleteSound('${s.name}')">Hapus</button>
            </div>
            <span class="progress"></span>
          </div>`;
      }).join('');
    }

    function filterSounds() {
      const q = document.getElementById('search-box').value.toLowerCase().trim();
      renderSounds(q ? currentSounds.filter(s => s.name.includes(q)) : currentSounds);
    }

    // One shared preview player; the playing row carries the gold progress line.
    function togglePlay(name) {
      if (playingName === name) {
        player.pause();
        playingName = null;
      } else {
        player.src = rawUrl(currentSounds.find(s => s.name === name));
        player.play().catch(() => showToast('Sound tidak bisa diputar', true));
        playingName = name;
      }
      filterSounds();
    }
    player.ontimeupdate = () => {
      const bar = document.querySelector(`[data-row="${playingName}"] .progress`);
      if (bar && player.duration) bar.style.width = `${(player.currentTime / player.duration) * 100}%`;
    };
    player.onended = () => { playingName = null; filterSounds(); };

    function copyCommand(name, prefix = '!sb') {
      navigator.clipboard.writeText(`${prefix} ${name}`)
        .then(() => showToast(`${prefix} ${name} disalin`))
        .catch(() => showToast(`Command: ${prefix} ${name}`));
    }

    // Styled replacement for confirm()/prompt() on a native <dialog>.
    // Resolves true (or the typed text when `value` is given) on confirm, null on cancel or Esc.
    function ask({ title, message, confirm, danger = false, value = null, prefix = '!sb' }) {
      const d = document.getElementById('ask');
      const input = document.getElementById('ask-input');
      const ok = document.getElementById('ask-ok');
      document.getElementById('ask-title').textContent = title;
      document.getElementById('ask-msg').textContent = message;
      document.getElementById('ask-field').hidden = value === null;
      document.getElementById('ask-prefix').textContent = prefix;
      input.value = value ?? '';
      ok.textContent = confirm;
      ok.classList.toggle('btn-danger', danger);
      ok.classList.toggle('btn-primary', !danger);
      d.returnValue = '';
      d.showModal();
      // Destructive dialogs start on Batal so a stray Enter cannot delete or overwrite.
      if (value !== null) { input.focus(); input.select(); } else (danger ? d.querySelector('.ask-actions .btn') : ok).focus();
      return new Promise(resolve => d.addEventListener('close',
        () => resolve(d.returnValue === 'ok' ? (value === null ? true : input.value) : null), { once: true }));
    }

    async function deleteSound(name) {
      if (!await ask({
        title: `Hapus "${name}"?`,
        message: `File-nya ikut terhapus dan !sb ${name} tidak bisa dipakai lagi.`,
        confirm: 'Hapus', danger: true,
      })) return;
      try {
        const res = await fetch(`/api/sounds/${encodeURIComponent(name)}`, {
          method: 'DELETE',
          headers: { 'X-Pin': getSavedPin() },
        });
        const data = await res.json();
        if (res.ok && data.success) {
          if (playingName === name) { player.pause(); playingName = null; }
          showToast(`"${name}" dihapus`);
          loadSounds();
        } else {
          showToast(data.error || 'Gagal menghapus sound', true);
        }
      } catch (err) {
        showToast('Koneksi gagal: ' + err.message, true);
      }
    }

    async function renameSound(oldName) {
      const newName = await ask({
        title: 'Ganti nama sound',
        message: `Command lama !sb ${oldName} tidak bisa dipakai lagi.`,
        confirm: 'Simpan', value: oldName,
      });
      // The dialog input is already cleaned as it is typed, so an empty or unchanged name just closes.
      const clean = cleanName(newName ?? '');
      if (!clean || clean === oldName) return;

      try {
        const res = await fetch(`/api/sounds/${encodeURIComponent(oldName)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'X-Pin': getSavedPin() },
          body: JSON.stringify({ newName: clean }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showToast(`Sekarang dipanggil dengan !sb ${clean}`);
          loadSounds();
        } else {
          showToast(data.error || 'Gagal mengganti nama', true);
        }
      } catch (err) {
        showToast('Koneksi gagal: ' + err.message, true);
      }
    }

    // ---- Views ----
    function showView() {
      const view = location.hash === '#playlist' ? 'playlist' : 'soundboard';
      document.getElementById('view-soundboard').hidden = view !== 'soundboard';
      document.getElementById('view-playlist').hidden = view !== 'playlist';
      document.getElementById('view-title').textContent = view === 'playlist' ? 'Playlist' : 'Soundboard';
      for (const id of ['subline', 'sb-action']) document.getElementById(id).hidden = view !== 'soundboard';
      for (const id of ['pl-subline', 'pl-action']) document.getElementById(id).hidden = view !== 'playlist';
      document.querySelectorAll('.tabs a').forEach(a => {
        if (a.getAttribute('href') === '#' + view) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
      if (view === 'playlist') loadPlaylists();
    }

    // ---- Playlists (played in Discord with !playlist <nama>) ----
    let playlists = [];
    let selectedPl = null;
    const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

    async function api(url, method = 'GET', body) {
      const res = await fetch(url, {
        method,
        headers: { 'X-Pin': getSavedPin(), 'Content-Type': 'application/json' },
        body: body && JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Permintaan gagal');
      return data;
    }

    async function loadPlaylists() {
      try {
        playlists = (await api('/api/playlists')).playlists;
      } catch (err) {
        document.getElementById('pl-detail').innerHTML =
          `<p class="empty">Playlist gagal dimuat. <button onclick="loadPlaylists()">Coba lagi</button></p>`;
        return;
      }
      if (!playlists.some(p => p.name === selectedPl)) selectedPl = playlists[0]?.name ?? null;
      renderPlaylists();
    }

    // Playlist names are sanitized to [a-z0-9_-] by the server; song titles come from YouTube and are escaped.
    function renderPlaylists() {
      const songs = playlists.reduce((n, p) => n + p.songs.length, 0);
      document.getElementById('pl-subline').innerHTML =
        `${playlists.length} playlist · ${songs} lagu · putar di Discord dengan <code>!playlist nama</code>`;

      // With no playlists the list column has nothing to show: one full-width card holds the empty state.
      document.querySelector('.pl-grid').classList.toggle('solo', !playlists.length);
      document.getElementById('pl-list').hidden = !playlists.length;
      document.getElementById('pl-list').innerHTML = playlists.map(p => `
          <button class="pl-item" aria-current="${p.name === selectedPl}" onclick="selectedPl = '${p.name}'; renderPlaylists()">
            <span class="n">${esc(p.name)}</span><span class="c num">${p.songs.length} lagu</span>
          </button>`).join('');

      const pl = playlists.find(p => p.name === selectedPl);
      const detail = document.getElementById('pl-detail');
      if (!pl) {
        detail.innerHTML = '<p class="empty">Belum ada playlist. Buat yang pertama, lalu tambahkan lagu dari judul atau URL YouTube.</p>';
        return;
      }
      detail.innerHTML = `
        <div class="pl-head">
          <div>
            <h2>${esc(pl.name)}</h2>
            <button class="cmd" onclick="copyCommand('${pl.name}', '!playlist')" title="Salin command">!playlist ${esc(pl.name)}
              <svg width="12" height="12" aria-hidden="true"><use href="#i-copy"/></svg></button>
          </div>
          <button class="link danger" onclick="deletePlaylist()">Hapus playlist</button>
        </div>
        <form class="pl-add" onsubmit="event.preventDefault(); addSong()">
          <div class="field"><input class="plain" id="song-input" placeholder="Judul lagu atau URL YouTube" autocomplete="off" aria-label="Judul lagu atau URL YouTube" /></div>
          <button class="btn btn-primary" id="song-btn" type="submit">Tambah lagu</button>
        </form>
        ${pl.songs.length
          ? `<ol class="songs">${pl.songs.map((s, i) => `
              <li><div class="song">
                <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>
                <span class="dur num">${esc(s.duration)}</span>
                <button class="link danger" onclick="removeSong(${i})">Hapus</button>
              </div></li>`).join('')}</ol>`
          : '<p class="empty">Belum ada lagu di playlist ini.</p>'}`;
    }

    async function createPlaylist() {
      const name = cleanName(await ask({
        title: 'Playlist baru',
        message: 'Nama ini dipakai di Discord untuk memutarnya.',
        confirm: 'Buat', value: '', prefix: '!playlist',
      }) ?? '');
      if (!name) return;
      try {
        await api('/api/playlists', 'POST', { name });
        selectedPl = name;
        showToast(`Playlist ${name} dibuat`);
        loadPlaylists();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    async function deletePlaylist() {
      const pl = playlists.find(p => p.name === selectedPl);
      if (!pl || !await ask({
        title: `Hapus playlist "${pl.name}"?`,
        message: `${pl.songs.length} lagu di dalamnya ikut terhapus dari playlist.`,
        confirm: 'Hapus', danger: true,
      })) return;
      try {
        await api(`/api/playlists/${encodeURIComponent(pl.name)}`, 'DELETE');
        showToast(`Playlist ${pl.name} dihapus`);
        loadPlaylists();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    // Adding a song asks the server to look it up on YouTube, which takes a few seconds.
    async function addSong() {
      const input = document.getElementById('song-input');
      const btn = document.getElementById('song-btn');
      const query = input.value.trim();
      if (!query) return input.focus();
      btn.disabled = true;
      btn.textContent = 'Mencari…';
      try {
        const { song } = await api(`/api/playlists/${encodeURIComponent(selectedPl)}/songs`, 'POST', { query });
        showToast(`Ditambahkan: ${song.title}`);
        await loadPlaylists();
        document.getElementById('song-input')?.focus();
      } catch (err) {
        showToast(err.message, true);
        btn.disabled = false;
        btn.textContent = 'Tambah lagu';
      }
    }

    async function removeSong(index) {
      try {
        await api(`/api/playlists/${encodeURIComponent(selectedPl)}/songs/${index}`, 'DELETE');
        loadPlaylists();
      } catch (err) {
        showToast(err.message, true);
      }
    }
  </script>
</body>
</html>
